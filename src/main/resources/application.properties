spring.application.name=CMS

# Optionally load a local .env file (KEY=VALUE, no quotes). Real environment variables
# always win over it. The file is ignored if it does not exist.
spring.config.import=optional:file:.env[.properties]

# --- Database (required) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Server ---
server.port=${PORT:8080}

# --- Logging ---
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# --- Application secrets / settings (required unless a default is shown) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.id-encryption-key=${ID_ENCRYPTION_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Outgoing mail (SMTP) for password-reset OTPs ---
# Leave MAIL_HOST empty to run without mail: the API still works, codes are just not sent (a warning is logged).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}

# --- Password reset OTP ---
app.password-reset.otp-ttl-minutes=${OTP_TTL_MINUTES:10}
app.password-reset.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.password-reset.max-attempts=${OTP_MAX_ATTEMPTS:5}
